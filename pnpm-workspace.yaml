  ai: ^7.0.65
  "@ai-sdk/react": ^4.0.68
  "@ai-sdk/mcp": 2.0.31 # exact: matches the copy @ai-sdk/react pins, one @ai-sdk/provider in the tree
  "@json-render/core": ^0.19.0
  "@json-render/react": ^0.19.0
  "@sanity/client": ^7.26.2
  "@tailwindcss/postcss": ^4.2.1
  "@types/node": ^25.5.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  lucide-react: ^0.577.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  react-is: ^19.2.8
  sanity: ^6.1.0
  tailwindcss: ^4.2.1
  tw-animate-css: ^1.4.0
  typescript: 5.9.2
  vitest: ^3.2.4
  zod: ^4.3.6

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp

overrides:
  "@babel/plugin-transform-modules-systemjs@<7.29.4": ^7.29.4
  "@codemirror/state": ^6.7.1
  "@trpc/server@<11.8.0": ^11.8.0
  brace-expansion@<1.1.13: ^1.1.13
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  dompurify@<3.4.0: ^3.4.0
  esbuild@<0.28.1: ^0.28.1
  js-yaml@<3.14.2: ^3.14.2
  lodash-es@<4.18.0: ^4.18.0
  lodash@<4.18.0: ^4.18.0
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=5.0.0 <5.1.8: ^5.1.8
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  postcss@<8.5.10: ^8.5.10
  prismjs@<1.30.0: ^1.30.0
  rollup@<4.59.0: ^4.59.0
  undici@<6.24.0: ^6.24.0
  yaml@<1.10.3: ^1.10.3

peerDependencyRules:
  allowedVersions:
    "@csstools/css-syntax-patches-for-csstree>css-tree": ">=3"
    # Studio pins @sanity/icons 4.1.0 — the only line shipping BOTH the v3
    # barrel (needed by sanity-plugin-lucide-icon-picker's dist) and the
    # per-icon subpaths @sanity/context imports (peer-declared ^5).
    "@sanity/context>@sanity/icons": ">=4"
    "@sanity/context>ai": ">=6"
    "sanity-plugin-lucide-icon-picker>@sanity/icons": ">=3"
    next-sanity>sanity: ">=5"
    sanity-plugin-asset-source-unsplash>sanity: ">=5"
    sanity-plugin-lucide-icon-picker>@sanity/ui: ">=3"
    sanity-plugin-lucide-icon-picker>sanity: ">=5"
    sanity-plugin-media>sanity: ">=5"
    sanity-plugin-mux-input>@sanity/ui: ">=3"
    sanity-plugin-mux-input>sanity: ">=5"
    sanity-plugin-utils>sanity: ">=5"
